<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon Group C - Retractions of Academic Publications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        /* Your existing CSS with additions for visualization */
        /* ... your existing CSS code ... */
        
        /* Visualization specific styles */
        .visualization-section {
            padding: 150px 0;
            position: relative;
        }
        
        .visualization-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .chart-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .chart-dropdown {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(224, 163, 255, 0.3);
            border-radius: 10px;
            color: #e0a3ff;
            padding: 12px 20px;
            font-family: inherit;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            min-width: 200px;
        }
        
        .chart-dropdown option {
            background: #1a1a1a;
            color: #e0a3ff;
        }
        
        .visualization-area {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .map-container, .chart-container {
            min-height: 600px;
            border-radius: 20px;
            overflow: hidden;
        }
        
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: #e0a3ff;
            font-size: 1.2rem;
        }
        
        .country-info {
            text-align: center;
            margin-bottom: 20px;
            color: #e0a3ff;
            font-size: 1.4rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Your existing HTML structure -->
    <!-- ... your existing HTML code ... -->

    <!-- Visualization Section -->
    <section class="visualization-section" id="visualization">
        <div class="visualization-container">
            <h2 class="section-title">INTERACTIVE RETRACTIONS ANALYSIS</h2>
            
            <div class="chart-controls glass">
                <select id="chartType" class="chart-dropdown">
                    <option value="sankey">Sankey Diagram</option>
                    <option value="pie">Pie Chart</option>
                </select>
                <button id="backButton" class="cta-button secondary" style="display: none;">← Back to World Map</button>
            </div>
            
            <div class="visualization-area">
                <div id="countryInfo" class="country-info"></div>
                <div id="map-container" class="map-container glass"></div>
                <div id="chart-container" class="chart-container glass" style="display: none;"></div>
            </div>
        </div>
    </section>

    <!-- Your existing footer -->
    <!-- ... your existing footer code ... -->

    <script>
        // Your existing JavaScript
        // ... your existing JavaScript code ...

        // Visualization JavaScript
        class RetractionsVisualizer {
            constructor() {
                this.worldData = null;
                this.retractionsData = null;
                this.currentCountry = null;
                this.isMapView = true;
                
                this.initializeVisualization();
            }
            
            async initializeVisualization() {
                await this.loadData();
                this.createWorldMap();
                this.setupEventListeners();
            }
            
            async loadData() {
                // In a real implementation, you would load your actual data
                // For now, we'll create mock data that matches your structure
                this.createMockData();
            }
            
            createMockData() {
                // Mock country data with retraction counts
                this.worldData = {
                    type: 'FeatureCollection',
                    features: [
                        {
                            type: 'Feature',
                            properties: { NAME: 'China', Retraction_Count: 25271 },
                            geometry: { type: 'Point', coordinates: [104.1954, 35.8617] }
                        },
                        {
                            type: 'Feature',
                            properties: { NAME: 'United States', Retraction_Count: 15432 },
                            geometry: { type: 'Point', coordinates: [-95.7129, 37.0902] }
                        },
                        {
                            type: 'Feature',
                            properties: { NAME: 'India', Retraction_Count: 8765 },
                            geometry: { type: 'Point', coordinates: [78.9629, 20.5937] }
                        },
                        {
                            type: 'Feature',
                            properties: { NAME: 'United Kingdom', Retraction_Count: 6543 },
                            geometry: { type: 'Point', coordinates: [-3.4360, 55.3781] }
                        },
                        {
                            type: 'Feature',
                            properties: { NAME: 'Germany', Retraction_Count: 5432 },
                            geometry: { type: 'Point', coordinates: [10.4515, 51.1657] }
                        },
                        {
                            type: 'Feature',
                            properties: { NAME: 'Japan', Retraction_Count: 4321 },
                            geometry: { type: 'Point', coordinates: [138.2529, 36.2048] }
                        },
                        {
                            type: 'Feature',
                            properties: { NAME: 'France', Retraction_Count: 3987 },
                            geometry: { type: 'Point', coordinates: [2.2137, 46.2276] }
                        },
                        {
                            type: 'Feature',
                            properties: { NAME: 'Canada', Retraction_Count: 3456 },
                            geometry: { type: 'Point', coordinates: [-106.3468, 56.1304] }
                        },
                        {
                            type: 'Feature',
                            properties: { NAME: 'Australia', Retraction_Count: 2987 },
                            geometry: { type: 'Point', coordinates: [133.7751, -25.2744] }
                        },
                        {
                            type: 'Feature',
                            properties: { NAME: 'Brazil', Retraction_Count: 2876 },
                            geometry: { type: 'Point', coordinates: [-53.2, -10.3333] }
                        }
                    ]
                };
                
                // Mock subject distribution data
                this.retractionsData = {
                    'China': {
                        'Business & Technology': 6320,
                        'Biological & Life Sciences': 5840,
                        'Chemistry': 4210,
                        'Engineering': 3850,
                        'Medicine': 3050,
                        'Physical Sciences': 1200,
                        'Social Sciences': 801
                    },
                    'United States': {
                        'Business & Technology': 3210,
                        'Biological & Life Sciences': 4210,
                        'Chemistry': 2540,
                        'Engineering': 1980,
                        'Medicine': 1850,
                        'Physical Sciences': 980,
                        'Social Sciences': 662
                    },
                    'India': {
                        'Business & Technology': 1980,
                        'Biological & Life Sciences': 2450,
                        'Chemistry': 1560,
                        'Engineering': 1320,
                        'Medicine': 980,
                        'Physical Sciences': 320,
                        'Social Sciences': 155
                    }
                    // Add more countries as needed
                };
            }
            
            createWorldMap() {
                const locations = this.worldData.features.map(f => f.geometry.coordinates);
                const text = this.worldData.features.map(f => 
                    `<b>${f.properties.NAME}</b><br>Retractions: ${f.properties.Retraction_Count.toLocaleString()}`
                );
                const sizes = this.worldData.features.map(f => 
                    Math.max(10, Math.log(f.properties.Retraction_Count) * 8)
                );
                const colors = this.worldData.features.map(f => f.properties.Retraction_Count);
                
                const trace = {
                    type: 'scattergeo',
                    mode: 'markers',
                    locations: this.worldData.features.map(f => f.properties.NAME),
                    locationmode: 'country names',
                    text: text,
                    marker: {
                        size: sizes,
                        color: colors,
                        colorscale: 'Plasma',
                        colorbar: {
                            title: 'Retraction Count',
                            thickness: 20
                        },
                        line: {
                            color: '#e0a3ff',
                            width: 2
                        }
                    },
                    hoverinfo: 'text',
                    name: 'Retractions'
                };
                
                const layout = {
                    title: {
                        text: 'Academic Paper Retractions by Country',
                        font: { color: '#e0a3ff', size: 24 }
                    },
                    geo: {
                        scope: 'world',
                        projection: { type: 'natural earth' },
                        bgcolor: 'rgba(0,0,0,0)',
                        showland: true,
                        landcolor: 'rgb(30,30,30)',
                        showocean: true,
                        oceancolor: 'rgb(10,10,40)',
                        showlakes: true,
                        lakecolor: 'rgb(10,10,40)',
                        showcountries: true,
                        countrycolor: 'rgb(100,100,100)',
                        countrywidth: 0.5,
                        subunitcolor: 'rgb(100,100,100)'
                    },
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: { color: '#e0a3ff' },
                    margin: { t: 80, r: 0, b: 0, l: 0 },
                    height: 600
                };
                
                const config = {
                    displayModeBar: true,
                    displaylogo: false,
                    modeBarButtonsToRemove: ['pan2d', 'lasso2d', 'select2d'],
                    responsive: true
                };
                
                Plotly.newPlot('map-container', [trace], layout, config).then(() => {
                    this.setupMapInteractions();
                });
            }
            
            setupMapInteractions() {
                const mapContainer = document.getElementById('map-container');
                
                mapContainer.on('plotly_click', (data) => {
                    if (data.points && data.points[0]) {
                        const countryName = data.points[0].location;
                        this.showCountryData(countryName);
                    }
                });
            }
            
            showCountryData(countryName) {
                this.currentCountry = countryName;
                this.isMapView = false;
                
                // Update UI
                document.getElementById('countryInfo').textContent = `Data for ${countryName}`;
                document.getElementById('map-container').style.display = 'none';
                document.getElementById('chart-container').style.display = 'block';
                document.getElementById('backButton').style.display = 'block';
                
                // Show initial chart based on dropdown selection
                const chartType = document.getElementById('chartType').value;
                this.updateChartDisplay(chartType);
            }
            
            updateChartDisplay(chartType) {
                if (!this.currentCountry) return;
                
                const countryData = this.retractionsData[this.currentCountry];
                if (!countryData) {
                    this.showNoDataMessage();
                    return;
                }
                
                if (chartType === 'sankey') {
                    this.createSankeyChart(countryData);
                } else {
                    this.createPieChart(countryData);
                }
            }
            
            createSankeyChart(countryData) {
                const categories = Object.keys(countryData);
                const values = Object.values(countryData);
                
                // Prepare data for Sankey diagram
                const labels = [...categories, this.currentCountry];
                const source = categories.map((_, index) => index);
                const target = categories.map(() => categories.length);
                const valuesFlow = values;
                
                const trace = {
                    type: "sankey",
                    orientation: "h",
                    node: {
                        pad: 15,
                        thickness: 20,
                        line: {
                            color: "black",
                            width: 0.5
                        },
                        label: labels,
                        color: [
                            ...categories.map(() => this.getCategoryColor()),
                            '#ff6b6b' // Country color
                        ]
                    },
                    link: {
                        source: source,
                        target: target,
                        value: valuesFlow,
                        color: "rgba(255,255,255,0.2)"
                    }
                };
                
                const layout = {
                    title: {
                        text: `Subject Distribution for ${this.currentCountry}`,
                        font: { color: '#e0a3ff', size: 20 }
                    },
                    font: {
                        size: 12,
                        color: '#e0a3ff'
                    },
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    height: 500
                };
                
                Plotly.newPlot('chart-container', [trace], layout);
            }
            
            createPieChart(countryData) {
                const categories = Object.keys(countryData);
                const values = Object.values(countryData);
                
                const trace = {
                    type: "pie",
                    values: values,
                    labels: categories,
                    textinfo: "label+percent",
                    insidetextorientation: "radial",
                    marker: {
                        colors: categories.map(() => this.getCategoryColor())
                    },
                    hole: 0.4
                };
                
                const layout = {
                    title: {
                        text: `Subject Distribution for ${this.currentCountry}`,
                        font: { color: '#e0a3ff', size: 20 }
                    },
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: { color: '#e0a3ff' },
                    showlegend: true,
                    height: 500
                };
                
                Plotly.newPlot('chart-container', [trace], layout);
            }
            
            showNoDataMessage() {
                document.getElementById('chart-container').innerHTML = `
                    <div class="loading-spinner">
                        <div>
                            <h3>No Data Available</h3>
                            <p>There is no retraction data available for ${this.currentCountry}.</p>
                        </div>
                    </div>
                `;
            }
            
            getCategoryColor() {
                const colors = [
                    '#e0a3ff', '#ff69b4', '#9370db', '#00ffff', 
                    '#ff0080', '#8000ff', '#00ff80', '#ff8000'
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }
            
            showWorldMap() {
                this.currentCountry = null;
                this.isMapView = true;
                
                // Update UI
                document.getElementById('countryInfo').textContent = '';
                document.getElementById('map-container').style.display = 'block';
                document.getElementById('chart-container').style.display = 'none';
                document.getElementById('backButton').style.display = 'none';
            }
            
            setupEventListeners() {
                // Chart type dropdown
                document.getElementById('chartType').addEventListener('change', (e) => {
                    if (!this.isMapView) {
                        this.updateChartDisplay(e.target.value);
                    }
                });
                
                // Back button
                document.getElementById('backButton').addEventListener('click', () => {
                    this.showWorldMap();
                });
            }
        }
        
        // Initialize the visualizer when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new RetractionsVisualizer();
        });
    </script>
</body>
</html>
